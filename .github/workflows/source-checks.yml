name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-fixtures:
    name: Python tooling (public fixtures)
    runs-on: windows-latest
    env:
      DYNA_TEST_INPUTS: ${{ github.workspace }}/private-fixtures-not-in-repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify patch, codec, source-pin and packaging contracts
        run: python -m unittest discover -s tests -v
      - name: Check tracked whitespace
        run: git diff --check
